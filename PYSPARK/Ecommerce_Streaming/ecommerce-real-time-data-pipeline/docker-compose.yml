services:
  data-generator:
    build:
      context: ./data_generator
      dockerfile: Dockerfile
    volumes:
      - data:/data
    networks:
      - pipeline-network
    depends_on:
      - postgres
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    volumes:
      - data:/data
    networks:
      - pipeline-network
    depends_on:
      - postgres
    environment:
      - SPARK_MODE=master
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./postgres/postgres_setup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pipeline-network
    ports:
      - "5432:5432"
    env_file:
      - .env

volumes:
  data:

networks:
  pipeline-network:
    driver: bridge